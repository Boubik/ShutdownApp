name: Build and release

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

concurrency:
  group: idle-shutdown-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Read and validate release version
        id: version
        run: |
          $version = (Get-Content VERSION -Raw).Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "VERSION must contain a semantic version such as 1.2.3. Received: '$version'."
          }

          $tag = "v$version"
          git fetch --force --tags
          if ($LASTEXITCODE -ne 0) {
              throw "git fetch --tags failed with exit code $LASTEXITCODE."
          }

          $existingTags = @(git tag --list $tag)
          if ($LASTEXITCODE -ne 0) {
              throw "git tag --list failed with exit code $LASTEXITCODE."
          }

          if ($existingTags.Count -gt 0) {
              throw "Tag $tag already exists. Increase VERSION before creating another release."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          "### Preparing Idle Shutdown $tag" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Verify stable release and updater safeguards
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Stable releases must use numeric SemVer: $version"
          }
          $defines = dotnet msbuild 'src/IdleShutdown.Service/IdleShutdown.Service.csproj' -getProperty:DefineConstants
          if ($LASTEXITCODE -ne 0 -or $defines -match 'PRERELEASE_VERBOSE') {
            throw "Stable build unexpectedly includes debug diagnostics: $defines"
          }
          foreach ($file in @(
            'packaging/idle-shutdown/tools/chocolateyinstall.ps1',
            'packaging/idle-shutdown/tools/chocolateyuninstall.ps1',
            'packaging/idle-shutdown/tools/self-update.ps1',
            'packaging/idle-shutdown/tools/config-migrate.ps1',
            'tests/ConfigMigration.Tests.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors)
            if ($null -ne $parseErrors -and $parseErrors.Count -gt 0) {
              throw "PowerShell script has a syntax error: $file"
            }
          }
          if ($version -eq '2.0.1') {
            # Release-specific regression: the packaged defaults must be on.
            $defaults = Get-Content 'config.json' -Raw | ConvertFrom-Json
            foreach ($option in @('MaintenanceEnabled', 'OptionalDriversEnabled', 'SelfUpdateEnabled')) {
              if ($defaults.$option -ne $true) {
                throw "2.0.1 must enable $option for new installs."
              }
            }
            $serviceConfig = Get-Content 'src/IdleShutdown.Service/AppConfig.cs' -Raw
            $agentConfig = Get-Content 'src/IdleShutdown.Agent/AppConfig.cs' -Raw
            foreach ($option in @('MaintenanceEnabled', 'OptionalDriversEnabled', 'SelfUpdateEnabled')) {
              if (-not $serviceConfig.Contains("bool $option { get; set; } = true;")) {
                throw "Service default mismatch: $option"
              }
            }
            if (-not $agentConfig.Contains('bool MaintenanceEnabled { get; set; } = true;')) {
              throw 'Agent maintenance default mismatch.'
            }
          }
          $packagedDefaults = Get-Content 'config.json' -Raw | ConvertFrom-Json
          if ([string]$packagedDefaults.ConfigVersion -ne $version) {
            throw "ConfigVersion must equal VERSION: expected $version, found $($packagedDefaults.ConfigVersion)"
          }
          ./tests/ConfigMigration.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Config migration regression tests failed.' }
          $helper = Get-Content 'packaging/idle-shutdown/tools/self-update.ps1' -Raw
          foreach ($required in @('--version=$targetVersion',
                                   'Skipped non-stable upgrade target',
                                   '$maxLogBytes = 2MB')) {
            if (-not $helper.Contains($required)) {
              throw "Stable self-updater missing invariant: $required"
            }
          }
          if ($helper.Contains('SelfUpdateAllowPrerelease') -or
              $helper.Contains('$queryArgs += ''--pre''') -or
              $helper.Contains('$upgradeArgs += ''--pre''')) {
            throw 'Automatic self-updater may never install prereleases.'
          }
          $installer = Get-Content 'packaging/idle-shutdown/tools/chocolateyinstall.ps1' -Raw
          foreach ($required in @('Set-ScheduledTask -TaskName $selfUpdateTaskName',
                                   'Stop-InstalledAgents', 'maintenance.lock',
                                   'Merge-IdleShutdownConfiguration', 'config.json.pre-')) {
            if (-not $installer.Contains($required)) {
              throw "Stable installer missing safety guard: $required"
            }
          }
      - name: Run tests and build Windows package
        run: .\build.bat

      - name: Verify release artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $packagePath = 'dist\package\idle-shutdown.nupkg'

          if (-not (Test-Path $packagePath)) {
              throw "Expected package is missing: $packagePath"
          }

          $packages = @(Get-ChildItem 'dist\package' -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1) {
              throw "Expected exactly one .nupkg, found $($packages.Count)."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $packagePath))

          try {
              $nuspecEntry = $archive.Entries |
                  Where-Object { $_.FullName -eq 'idle-shutdown.nuspec' } |
                  Select-Object -First 1

              if ($null -eq $nuspecEntry) {
                  throw 'The package does not contain idle-shutdown.nuspec.'
              }

              $migrationEntry = $archive.Entries |
                  Where-Object { $_.FullName -eq 'tools/config-migrate.ps1' } |
                  Select-Object -First 1
              if ($null -eq $migrationEntry) {
                  throw 'Package does not contain config-migrate.ps1.'
              }

              $reader = [System.IO.StreamReader]::new($nuspecEntry.Open())
              try {
                  [xml] $nuspec = $reader.ReadToEnd()
              }
              finally {
                  $reader.Dispose()
              }
          }
          finally {
              $archive.Dispose()
          }

          $versionNode = $nuspec.SelectSingleNode(
              "/*[local-name()='package']/*[local-name()='metadata']/*[local-name()='version']")

          if ($null -eq $versionNode) {
              throw 'The package nuspec does not contain a version element.'
          }

          $packageVersion = $versionNode.InnerText.Trim()
          if ($packageVersion -ne $env:RELEASE_VERSION) {
              throw "Package version '$packageVersion' does not match VERSION '$env:RELEASE_VERSION'."
          }

          foreach ($executable in @(
              'dist\Service\IdleShutdown.Service.exe',
              'dist\Agent\IdleShutdown.Agent.exe'
          )) {
              if (-not (Test-Path $executable)) {
                  throw "Expected executable is missing: $executable"
              }

              $productVersion = (Get-Item $executable).VersionInfo.ProductVersion
              if ($productVersion -notlike "$($env:RELEASE_VERSION)*") {
                  throw "$executable has product version '$productVersion', expected '$env:RELEASE_VERSION'."
              }
          }

          "- Verified package and executable version: ``$env:RELEASE_VERSION``" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Generate release notes from commits
        id: notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Changelog for a stable release starts at the previous STABLE tag,
          # never at a 2.0.0-beta prerelease.
          $previousTag = @(
              git tag --merged HEAD --sort=-version:refname 'v[0-9]*' |
                  Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' }
          ) | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($previousTag)) {
              $range = 'HEAD'
              $sinceText = 'the beginning of the repository'
              $commits = @(git log HEAD --no-merges --pretty=format:'- %s (`%h`)')
          }
          else {
              $range = "$previousTag..HEAD"
              $sinceText = $previousTag
              $commits = @(git log $range --no-merges --pretty=format:'- %s (`%h`)')
          }

          if ($commits.Count -eq 0) {
              $commits = @('- Version metadata update.')
          }

          $notes = @(
              "# Idle Shutdown v$env:RELEASE_VERSION",
              '',
              "## Changes since $sinceText",
              '',
              $commits,
              '',
              '## Download',
              '',
              '- `idle-shutdown.nupkg` — self-contained Windows x64 service, agent and Chocolatey installer.'
          )

          $notes | Out-File -FilePath 'release-notes.md' -Encoding utf8

          "previous_tag=$previousTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "- Release notes contain $($commits.Count) commit(s) since $sinceText." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create $env:RELEASE_TAG `
              'dist\package\idle-shutdown.nupkg' `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "Idle Shutdown $env:RELEASE_TAG" `
              --notes-file 'release-notes.md' `
              --latest

          "- Published release: ``$env:RELEASE_TAG``" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
