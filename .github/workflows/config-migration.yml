name: Configuration migration tests

on:
  push:
    branches: [main]
    paths:
      - 'packaging/idle-shutdown/tools/config-migrate.ps1'
      - 'packaging/idle-shutdown/tools/chocolateyinstall.ps1'
      - 'tests/ConfigMigration.Tests.ps1'
      - 'config.json'
      - '.github/workflows/config-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - name: Validate installer and migration PowerShell syntax
        run: |
          foreach ($file in @(
            'packaging/idle-shutdown/tools/chocolateyinstall.ps1',
            'packaging/idle-shutdown/tools/config-migrate.ps1',
            'tests/ConfigMigration.Tests.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors)
            foreach ($parseError in $parseErrors) {
              Write-Host ("{0}:{1}: {2}" -f $file, $parseError.Extent.StartLineNumber, $parseError.Message)
            }
            if ($null -ne $parseErrors -and $parseErrors.Count -gt 0) {
              throw "PowerShell syntax validation failed: $file"
            }
          }
      - name: Run real PowerShell config migrations
        run: ./tests/ConfigMigration.Tests.ps1
